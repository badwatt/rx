name: Release

# Publishes one release per VERSION bump: when the tag `v<VERSION>` does not
# exist yet, the binaries are built, packaged and attached to a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing a release needs to write tags and releases.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed to detect an already released version.
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check for existing release tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="refs/tags/v$VERSION"
          if git rev-parse --quiet --verify "$tag" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip
        if: steps.tag.outputs.released == 'true'
        run: echo "v$(cat VERSION) already released; bump VERSION to publish."

  build:
    needs: check
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries: no glibc / interpreter to match on the target.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            tool: cargo
            test: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            tool: cross
            test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            tool: cargo
            test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            tool: cargo
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99

      # `rust-toolchain.toml` overrides the default toolchain, so add the
      # target to *that* one: the action's `targets:` input installs it on
      # the action's own toolchain name, which cargo never uses.
      - name: Add target
        if: matrix.tool == 'cargo'
        run: rustup target add "${{ matrix.target }}"

      - uses: taiki-e/install-action@cross
        if: matrix.tool == 'cross'

      # Gate the released binaries on a green test suite: never ship what CI
      # would reject. One job is enough, the sources are the same.
      - name: Test
        if: matrix.test
        run: cargo test --all-targets --locked

      - name: Build
        run: >-
          ${{ matrix.tool }} build --release --locked
          --target "${{ matrix.target }}"

      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rx-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/rx" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: rx-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # No checkout in this job: name the repository explicitly so `gh`
          # does not look for a git remote.
          gh release create "v$VERSION" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
