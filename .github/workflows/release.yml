name: Release

# Publishes one release per version bump (`[package].version` in Cargo.toml):
# when the tag `v<version>` does not exist yet, the binaries are built,
# packaged and attached to a new release.
#
# A manual run always builds (so the matrix and the action versions can be
# validated without a version bump); it only publishes when asked to.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release when the version has no tag yet"
        type: boolean
        default: false

# Publishing a release needs to write tags and releases.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to detect an already released version.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(awk -F'"' '/^\[package\]/{p=1} p&&/^version/{print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="refs/tags/v$VERSION"
          if git rev-parse --quiet --verify "$tag" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip
        if: github.event_name == 'push' && steps.tag.outputs.released == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "v$VERSION already released; bump the version in Cargo.toml to publish."

  build:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries: no glibc / interpreter to match on the target.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            tool: cargo
            test: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            tool: cross
            test: false
          - target: aarch64-apple-darwin
            os: macos-latest
            tool: cargo
            test: false
          - target: x86_64-apple-darwin
            os: macos-latest
            tool: cargo
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt

      # `rust-toolchain.toml` overrides the default toolchain, so add the
      # target to *that* one: the action's `targets:` input installs it on
      # the action's own toolchain name, which cargo never uses.
      - name: Add target
        if: matrix.tool == 'cargo'
        run: rustup target add "${{ matrix.target }}"

      - uses: taiki-e/install-action@cross
        if: matrix.tool == 'cross'

      # Gate the released binaries on a green suite: never ship what CI would
      # reject. One job is enough, the sources are the same.
      - name: Format
        if: matrix.test
        run: cargo fmt --all -- --check

      - name: Lint
        if: matrix.test
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: matrix.test
        run: cargo test --all-targets --locked

      - name: Build
        run: >-
          ${{ matrix.tool }} build --release --locked
          --target "${{ matrix.target }}"

      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rx-v$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/rx" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: rx-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: >-
      needs.check.outputs.released == 'false' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      # The changelog needs every commit and tag between the two releases.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Previous tag
        id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.prev.outputs.tag }}
          toTag: ${{ github.sha }}
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n#{{UNCATEGORIZED}}",
              "commit_template": "- #{{TITLE}}",
              "categories": [
                {
                  "title": "## 🚨 Breaking Changes",
                  "labels": ["breaking"]
                },
                {
                  "title": "## 🚀 Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## ⚡️ Performance",
                  "labels": ["perf"]
                },
                {
                  "title": "## ♻️ Refactor",
                  "labels": ["refactor"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                },
                {
                  "title": "## 📝 Docs",
                  "labels": ["docs"]
                },
                {
                  "title": "## 💄 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔨 Build",
                  "labels": ["build"]
                },
                {
                  "title": "## 👷 CI",
                  "labels": ["ci"]
                },
                {
                  "title": "## 🧹 Chore",
                  "labels": ["chore"]
                },
                {
                  "title": "## ⏪ Revert",
                  "labels": ["revert"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^[a-z]+(\\([^)]*\\))?!:[\\s\\S]*",
                  "target": "breaking",
                  "on_property": "title"
                },
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]*\\))?!?:[\\s\\S]*",
                  "target": "$1",
                  "on_property": "title"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PREV: ${{ steps.prev.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # The template leaves blank lines behind when nothing is
          # uncategorized; trim them, then link the tag-to-tag diff.
          notes="${CHANGELOG%"${CHANGELOG##*[![:space:]]}"}"
          if [ -n "$PREV" ]; then
            notes="$notes"$'\n\n'"**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...v$VERSION"
          fi
          # Name the repository explicitly so `gh` does not depend on a remote.
          gh release create "v$VERSION" ./dist/*.tar.gz ./dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
