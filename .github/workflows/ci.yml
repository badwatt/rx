name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; keep the token read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
      - run: cargo test --all-targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Tests are counted too: --no-default-ignore-filename-regex disables
      # cargo-llvm-cov's built-in exclusion of tests.rs / tests/.
      - run: >-
          cargo llvm-cov --all-targets --no-default-ignore-filename-regex
          --fail-under-lines 100
          --fail-under-functions 100
          --fail-under-regions 100

  # Catch packaging breakage the cargo jobs cannot see (flake src filtering,
  # buildRustPackage, etc.).
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default --no-link
